services:
  zipkin-container:
    image: openzipkin/zipkin
    container_name: zipkin-container
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError
      - STORAGE_TYPE=mem # Keeps traces in RAM to avoid heavy Disk I/O
      - MEM_MAX_SPANS=10000 # Limit how many traces to keep
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9411"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  postgres-container:
    image: postgres:15-alpine
    container_name: postgres-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ar7_db
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ar7_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-container:
    image: redis:7-alpine
    container_name: redis-container
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-container:5432/ar7_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_REDIS_HOST: redis-container
      SPRING_REDIS_PORT: 6379
    deploy:
      resources:
        limits:
          memory: 1536M
    volumes:
      - ./upload-dir:/app/upload-dir
    depends_on:
      zipkin-container:
        condition: service_healthy
      postgres-container:
        condition: service_healthy
      redis-container:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[j]ava.*ar7.jar' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
