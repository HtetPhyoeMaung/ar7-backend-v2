spring:
  sql:
    init:
      mode: always
      continue-on-error: true
  server:
    port: 8080
    address: 0.0.0.0
  redis:
    host: ${SPRING_REDIS_HOST:redis-container}
    port: ${SPRING_REDIS_PORT:6379}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-container:5432/ar7_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    testWhileIdle: true
    validationQuery: SELECT 1
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  doc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html

file:
  upload-dir: ./upload-dir
  cdn:
    domain: https://ar7myanmar.com
management:
  tracing:
    sampling:
      # Trace only 10% of interactions to protect your 4GB RAM
      probability: 0.1
    baggage:
      enabled: true
  zipkin:
    tracing:
      # Uses the container name defined in your docker-compose
      endpoint: "http://zipkin-container:9411/api/v2/spans"
  endpoints:
    web:
      exposure:
        # Ensures tracing endpoints are visible to management tools
        include: "health,info,metrics,tracing"

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    org:
      springframework.jdbc.core: TRACE
      springframework.jdbc.datasource.init: DEBUG
      com.zaxxer.hikari: DEBUG
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
    com.security.spring.auth.AuthenticationService: DEBUG

